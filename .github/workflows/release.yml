name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tag is on stable
        run: |
          git fetch origin stable
          git merge-base --is-ancestor "$GITHUB_SHA" origin/stable \
            || { echo "::error::$GITHUB_REF_NAME is not on stable. Promote main to stable first."; exit 1; }
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Write the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PASTILLE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pastille-release.jks"
          echo "PASTILLE_KEYSTORE_PATH=$RUNNER_TEMP/pastille-release.jks" >> "$GITHUB_ENV"
      - run: ./gradlew --no-daemon assembleRelease
        env:
          PASTILLE_KEYSTORE_PASSWORD: ${{ secrets.PASTILLE_KEYSTORE_PASSWORD }}
      - name: Publish the signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "pastille-$version.apk"
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "pastille-$version.apk" --verify-tag --generate-notes $prerelease
