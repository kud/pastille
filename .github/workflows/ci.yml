name: android

# One workflow, as in tutti. A push or PR on main runs the checks. A manual run on main
# with a tag runs the same checks, then releases: vX.Y.Z-dev.N as a pre-release, vX.Y.Z as
# a final release that bumps the version, proves the build reproducible for F-Droid, and
# tags the bump commit. docs/RELEASING.md is the one documented way to release.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "vX.Y.Z (final) or vX.Y.Z-dev.N (pre-release); empty for a plain check"
        required: false
        default: ""
      dry_run:
        description: "Do everything except push, tag and release (allowed from any branch)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.event_name == 'workflow_dispatch' && 'release' || 'ci' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Test, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Unsigned: the release key is only ever written by the release job below. Two flavours
      # (docs/adr/0001-in-app-updates.md): every assemble and lint first runs checkNoNetwork*, which
      # fails if the fdroid build's merged manifest asks for INTERNET or any network permission.
      - run: ./gradlew --no-daemon assembleDebug assembleRelease testGithubDebugUnitTest testFdroidDebugUnitTest lintGithubDebug lintFdroidDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pastille-debug-apk
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: error
      - name: Room schemas match the committed ones
        run: |
          git diff --exit-code app/schemas
          test -z "$(git status --porcelain app/schemas)"

  release:
    name: Build the release
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.tag != '' && (github.ref == 'refs/heads/main' || inputs.dry_run)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The tag is new
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi

      # A final release bumps versionName and versionCode (+1) and its recipe build; it refuses
      # without fastlane/.../changelogs/<code>.txt of at most 500 characters. A dev build only checks.
      - name: Check the version
        id: version
        run: |
          case "$TAG" in *-*) mode=check ;; *) mode=bump ;; esac
          .github/scripts/release-version.sh "$mode" "$TAG" > "$RUNNER_TEMP/version.env"
          cat "$RUNNER_TEMP/version.env" | tee -a "$GITHUB_ENV"
          echo "prerelease=$(sed -n 's/^PRERELEASE=//p' "$RUNNER_TEMP/version.env")" >> "$GITHUB_OUTPUT"

      - name: Commit the bump as Erwann
        id: commit
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -c user.name="Erwann Mest" -c user.email="m@kud.io" \
            commit -q -a -m "🏷️ release(pastille): bump version to $VERSION_NAME"
          git show --stat --format='%H %an <%ae>%n%s' HEAD
          git branch release-bump
          git bundle create "$RUNNER_TEMP/release.bundle" "$GITHUB_SHA..release-bump"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      # The keystore exists only for this step and is removed before anything else runs.
      - name: Build the signed release
        env:
          KEYSTORE_BASE64: ${{ secrets.PASTILLE_KEYSTORE_BASE64 }}
          PASTILLE_KEYSTORE_PASSWORD: ${{ secrets.PASTILLE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$PASTILLE_KEYSTORE_PASSWORD" ]; then
            echo "::error::PASTILLE_KEYSTORE_BASE64 and PASTILLE_KEYSTORE_PASSWORD are required to release"
            exit 1
          fi
          keystore="$RUNNER_TEMP/pastille-release.jks"
          trap 'rm -f "$keystore"' EXIT
          echo "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          if [ "$PRERELEASE" = "true" ]; then export PASTILLE_VERSION_NAME="$VERSION_NAME"; fi
          PASTILLE_KEYSTORE_PATH="$keystore" ./gradlew --no-daemon assembleGithubRelease assembleFdroidRelease
          for flavour in github fdroid; do
            apk=app/build/outputs/apk/$flavour/release/app-$flavour-release.apk
            [ -f "$apk" ] || { echo "::error::$apk not found: the release build came out unsigned"; exit 1; }
          done

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/pastille-release.jks"

      - name: The APK is signed with Pastille's key
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          echo "$(dirname "$apksigner")" >> "$GITHUB_PATH"
          want=$(sed -n 's/^AllowedAPKSigningKeys: //p' docs/fdroid/app.beansontoast.pastille.yml)
          mkdir -p "$RUNNER_TEMP/out"
          # github: pastille-X.apk, the one the in-app updater installs. fdroid: pastille-X-fdroid.apk,
          # no network, the recipe's Binaries. Same key and version for both.
          for flavour in github fdroid; do
            apk=app/build/outputs/apk/$flavour/release/app-$flavour-release.apk
            "$apksigner" verify "$apk"
            # Public certificate digests only. The signer label varies with the scheme and build-tools.
            "$apksigner" verify --print-certs "$apk" | grep 'SHA-256 digest'
            got=$("$apksigner" verify --print-certs "$apk" | sed -n 's/^.*Signer.* certificate SHA-256 digest: //p' | sort -u)
            [ -n "$got" ] && [ "$got" = "$want" ] \
              || { echo "::error::$flavour: signing certificate $got is not the recipe's AllowedAPKSigningKeys $want"; exit 1; }
            badging=$("$(dirname "$apksigner")/aapt2" dump badging "$apk")
            head -n 1 <<<"$badging"
            grep -q "versionCode='$VERSION_CODE' versionName='$VERSION_NAME'" <<<"$badging" \
              || { echo "::error::$flavour: the APK is not versionCode $VERSION_CODE / versionName $VERSION_NAME"; exit 1; }
            if [ "$flavour" = fdroid ]; then
              ! grep -qE "uses-permission: name='android.permission.(INTERNET|REQUEST_INSTALL_PACKAGES)'" <<<"$badging" \
                || { echo "::error::The fdroid APK asks for the network or installs"; exit 1; }
              cp "$apk" "$RUNNER_TEMP/out/pastille-$VERSION_NAME-fdroid.apk"
            else
              grep -q "uses-permission: name='android.permission.INTERNET'" <<<"$badging" \
                || { echo "::error::The github APK lost INTERNET: its updater could not work"; exit 1; }
              cp "$apk" "$RUNNER_TEMP/out/pastille-$VERSION_NAME.apk"
            fi
          done
          (cd "$RUNNER_TEMP/out" && sha256sum *.apk | tee SHA256SUMS)

      # F-Droid rebuilds the tag's fdroid flavour from source and publishes our pastille-X-fdroid.apk
      # only if the two match apart from the signature. Rebuild unsigned from a clean `git archive` (no .git, another path) and compare.
      - name: The release is reproducible
        if: env.PRERELEASE == 'false'
        run: |
          src="$RUNNER_TEMP/repro/elsewhere/pastille"
          mkdir -p "$src"
          git archive HEAD | tar -x -C "$src"
          (cd "$src" && ./gradlew --no-daemon assembleFdroidRelease)
          unsigned="$src/app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk"
          [ -f "$unsigned" ] || { echo "::error::$unsigned not found"; exit 1; }
          pipx install apksigcopier==1.1.1
          apksigcopier compare "$RUNNER_TEMP/out/pastille-$VERSION_NAME-fdroid.apk" --unsigned "$unsigned" \
            || { echo "::error::The signed APK and a clean unsigned rebuild differ: F-Droid would reject this release"; exit 1; }
          echo "Reproducible: a clean rebuild matches the signed APK apart from the signature."

      - name: Release notes
        run: |
          if [ "$PRERELEASE" = "false" ]; then
            cp "$CHANGELOG" "$RUNNER_TEMP/out/notes.md"
          else
            printf 'Pre-release for testing; F-Droid skips it. Installs over %s (same versionCode) and is replaced by the next final release.\n' \
              "$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude '*-*' 2>/dev/null || echo 'the last release')" \
              > "$RUNNER_TEMP/out/notes.md"
          fi
          [ ! -f "$RUNNER_TEMP/release.bundle" ] || cp "$RUNNER_TEMP/release.bundle" "$RUNNER_TEMP/out/"

      - uses: actions/upload-artifact@v4
        with:
          name: pastille-release
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 14

      - name: Dry run summary
        if: inputs.dry_run
        run: |
          git fetch -q origin main
          {
            echo "### Dry run: $TAG"
            echo "Would push \`${{ steps.commit.outputs.sha }}\` as tag \`$TAG\`, release \`pastille-$VERSION_NAME.apk\` and \`pastille-$VERSION_NAME-fdroid.apk\` (prerelease: $PRERELEASE)."
            if [ "$PRERELEASE" = "false" ]; then
              if git merge-base --is-ancestor origin/main HEAD; then echo "main would fast-forward to the bump commit."
              else echo "main has moved: a real run from here would be refused (non-fast-forward)."; fi
            fi
            echo; echo "Notes:"; echo; cat "$RUNNER_TEMP/out/notes.md"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

  publish:
    name: Tag and publish
    needs: release
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
      SHA: ${{ needs.release.outputs.sha }}
      PRERELEASE: ${{ needs.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # main has no rule the workflow token can't meet today; a PAT is only needed if one is added.
          token: ${{ secrets.PASTILLE_RELEASE_TOKEN || github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: pastille-release
          path: ${{ runner.temp }}/out

      # One atomic push: main and the tag both move, or neither does (main moved since the run started).
      - name: Push the tag (and the bump to main)
        run: |
          refs=()
          if [ "$PRERELEASE" = "false" ]; then
            git fetch -q "$RUNNER_TEMP/out/release.bundle" release-bump
            [ "$(git rev-parse FETCH_HEAD)" = "$SHA" ] || { echo "::error::The bundle is not $SHA"; exit 1; }
            [ "$(git rev-parse FETCH_HEAD^)" = "$GITHUB_SHA" ] || { echo "::error::$SHA is not one commit on $GITHUB_SHA"; exit 1; }
            refs+=("$SHA:refs/heads/main")
          fi
          git tag "$TAG" "$SHA"
          refs+=("refs/tags/$TAG")
          git push --atomic origin "${refs[@]}"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          flags=(--verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/out/notes.md")
          [ "$PRERELEASE" = "false" ] || flags+=(--prerelease)
          out="$RUNNER_TEMP/out"
          (cd "$out" && sha256sum -c SHA256SUMS)
          gh release create "$TAG" "$out/pastille-$version.apk" "$out/pastille-$version-fdroid.apk" "$out/SHA256SUMS" "${flags[@]}"

      # The github build's updater installs only an APK whose SHA-256 matches the `digest` GitHub
      # reports for the asset (docs/adr/0001-in-app-updates.md). Check GitHub reports exactly ours.
      - name: GitHub reports the APKs' digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/out"
          for attempt in 1 2 3 4 5 6; do
            reported=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[] | select(.name | endswith(".apk")) | "\(.digest // "none")  \(.name)"' | sed 's/^sha256://' | sort)
            expected=$(cd "$out" && sha256sum *.apk | sort)
            [ "$reported" = "$expected" ] && { echo "$reported"; exit 0; }
            sleep 10
          done
          echo "::error::GitHub's asset digests differ from ours: the updater would refuse this release"
          printf 'reported:\n%s\nexpected:\n%s\n' "$reported" "$expected"
          exit 1

  # Every update of main gets the next vX.Y.Z-dev.N pre-release (Erwann, 2026-10-29), through the
  # same manual path above: once the checks pass, this asks for a run with the tag, which a
  # workflow token may do (workflow_dispatch is exempt from GitHub's no-recursion rule). Pushes
  # that touch only docs, and the final release's own bump commit, are skipped.
  dev-prerelease:
    name: Queue the next dev pre-release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, '🏷️ release')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pick the tag and queue the release
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" 2>/dev/null || echo unknown)
          if [ -n "$changed" ] && ! grep -qvE '^(docs/|.*\.md$)' <<<"$changed"; then
            echo "Only docs changed: no pre-release."; exit 0
          fi
          current=$(sed -n 's/^ *versionName = "\([^"]*\)"$/\1/p' app/build.gradle.kts)
          IFS=. read -r major minor patch <<<"$current"
          next="$major.$minor.$((patch + 1))"
          last=$(git tag -l "v$next-dev.*" | sed 's/.*-dev\.//' | sort -n | tail -n 1)
          tag="v$next-dev.$(( ${last:-0} + 1 ))"
          echo "Queueing $tag for $GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
          gh workflow run ci.yml --ref main -f tag="$tag"
