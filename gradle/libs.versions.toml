[versions]
agp = "8.7.3"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.25"
serialization-json = "1.7.3"
room = "2.6.1"
compose-bom = "2024.10.01"
activity-compose = "1.9.2"
core-ktx = "1.13.1"
core-splashscreen = "1.2.0"
exifinterface = "1.3.7"
lifecycle = "2.8.6"
savedstate = "1.3.0"
junit = "4.13.2"
robolectric = "4.14.1"
androidx-test-core = "1.6.1"
coroutines-test = "1.8.1"
reorderable = "2.4.3"
# Floors for vulnerable libraries that AGP, KSP and Robolectric bring in transitively; see the
# security-floors bundle below. They never lower a version, and nothing in the APK uses them.
floor-netty = "4.1.141.Final"
floor-protobuf = "3.25.9"
floor-commons-compress = "1.28.0"
floor-commons-io = "2.22.0"
floor-bouncycastle = "1.87"
floor-jose4j = "0.9.7"
floor-jdom2 = "2.0.6.1"
floor-guava = "32.0.1-jre"

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "core-splashscreen" }
exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
savedstate = { group = "androidx.savedstate", name = "savedstate", version.ref = "savedstate" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization-json" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidx-test-core" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines-test" }
reorderable = { group = "sh.calvin.reorderable", name = "reorderable", version.ref = "reorderable" }

floor-netty-buffer = { group = "io.netty", name = "netty-buffer", version.ref = "floor-netty" }
floor-netty-codec = { group = "io.netty", name = "netty-codec", version.ref = "floor-netty" }
floor-netty-codec-http = { group = "io.netty", name = "netty-codec-http", version.ref = "floor-netty" }
floor-netty-codec-http2 = { group = "io.netty", name = "netty-codec-http2", version.ref = "floor-netty" }
floor-netty-codec-socks = { group = "io.netty", name = "netty-codec-socks", version.ref = "floor-netty" }
floor-netty-common = { group = "io.netty", name = "netty-common", version.ref = "floor-netty" }
floor-netty-handler = { group = "io.netty", name = "netty-handler", version.ref = "floor-netty" }
floor-netty-handler-proxy = { group = "io.netty", name = "netty-handler-proxy", version.ref = "floor-netty" }
floor-netty-resolver = { group = "io.netty", name = "netty-resolver", version.ref = "floor-netty" }
floor-netty-transport = { group = "io.netty", name = "netty-transport", version.ref = "floor-netty" }
floor-netty-transport-native-unix-common = { group = "io.netty", name = "netty-transport-native-unix-common", version.ref = "floor-netty" }
floor-protobuf-java = { group = "com.google.protobuf", name = "protobuf-java", version.ref = "floor-protobuf" }
floor-protobuf-java-util = { group = "com.google.protobuf", name = "protobuf-java-util", version.ref = "floor-protobuf" }
floor-commons-compress = { group = "org.apache.commons", name = "commons-compress", version.ref = "floor-commons-compress" }
floor-commons-io = { group = "commons-io", name = "commons-io", version.ref = "floor-commons-io" }
floor-bcprov = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "floor-bouncycastle" }
floor-bcpkix = { group = "org.bouncycastle", name = "bcpkix-jdk18on", version.ref = "floor-bouncycastle" }
floor-bcutil = { group = "org.bouncycastle", name = "bcutil-jdk18on", version.ref = "floor-bouncycastle" }
floor-jose4j = { group = "org.bitbucket.b_c", name = "jose4j", version.ref = "floor-jose4j" }
floor-jdom2 = { group = "org.jdom", name = "jdom2", version.ref = "floor-jdom2" }
floor-guava = { group = "com.google.guava", name = "guava", version.ref = "floor-guava" }

[bundles]
security-floors = [
    "floor-netty-buffer",
    "floor-netty-codec",
    "floor-netty-codec-http",
    "floor-netty-codec-http2",
    "floor-netty-codec-socks",
    "floor-netty-common",
    "floor-netty-handler",
    "floor-netty-handler-proxy",
    "floor-netty-resolver",
    "floor-netty-transport",
    "floor-netty-transport-native-unix-common",
    "floor-protobuf-java",
    "floor-protobuf-java-util",
    "floor-commons-compress",
    "floor-commons-io",
    "floor-bcprov",
    "floor-bcpkix",
    "floor-bcutil",
    "floor-jose4j",
    "floor-jdom2",
    "floor-guava",
]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
