name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Write the release keystore
        if: github.event_name == 'push'
        env:
          KEYSTORE_BASE64: ${{ secrets.PASTILLE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pastille-release.jks"
            echo "PASTILLE_KEYSTORE_PATH=$RUNNER_TEMP/pastille-release.jks" >> "$GITHUB_ENV"
          fi
      - run: ./gradlew --no-daemon assembleDebug assembleRelease testDebugUnitTest lintDebug
        env:
          PASTILLE_KEYSTORE_PASSWORD: ${{ secrets.PASTILLE_KEYSTORE_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: env.PASTILLE_KEYSTORE_PATH != ''
        with:
          name: pastille-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pastille-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: error
      - name: Room schemas match the committed ones
        run: |
          git diff --exit-code app/schemas
          test -z "$(git status --porcelain app/schemas)"
